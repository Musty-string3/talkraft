前のコメント</button><span id="editPosition"></span><button id="editNext" type="button">次のコメント ▼</button></div><div id="quickPanel" class="quick-panel hidden"></div><div id="avatarStrip" class="avatar-strip"></div><div id="composerHelpers" class="composer-helpers"><div class="helpers-left"><button type="button" id="jumpFirst" aria-label="先頭のコメントへ" title="先頭へ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14M12 20V8m-5 5 5-5 5 5"/></svg></button><button type="button" id="jumpLast" aria-label="最後のコメントへ" title="最後へ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14M12 4v12m-5-5 5 5 5-5"/></svg></button></div><div class="helpers-right"><button type="button" id="helperNewline" aria-label="改行を挿入">↵ 改行</button><button type="button" id="helperUndo" aria-label="元に戻す" title="元に戻す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-2"/></svg></button><button type="button" id="helperRedo" aria-label="やり直す" title="やり直す"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h2"/></svg></button></div></div><div class="composer"><button id="speakerPicker" class="speaker-picker" aria-label="発言者を選ぶ"></button><select id="speaker" aria-label="発言者" class="hidden" tabindex="-1"></select><textarea id="entry" rows="1" placeholder="メッセージを入力…"></textarea><button id="newline" type="button" aria-label="改行" class="hidden" tabindex="-1">↵</button></div></section>

e"><option value="8">8 px</option><option value="9">9 px</option><option value="10">10 px</option><option value="11">11 px</option><option value="12">12 px</option><option value="13">13 px</option><option value="14">14 px</option><option value="15">15 px</option><option value="16">16 px</option><option value="17">17 px</option><option value="18">18 px</option><option value="19">19 px</option><option value="20">20 px</option><option value="21">21 px</option><option value="22">22 px</option><option value="23">23 px</option><option value="24">24 px</option><option value="25">25 px</option><option value="26">26 px</option><option value="27">27 px</option><option value="28">28 px</option><option value="29">29 px</option><option value="30">30 px</option><option value="31">31 px</option><option value="32">32 px</option></select></div><div class="settingsline"><label>ナレーター太字</label><input id="narratorBold" type="checkbox"></div><div class="settingsline"><label>吹き出し間隔</label><select id="bubbleGap"><option value="4">4 px</option><option value="5">5 px</option><option value="6">6 px</option><option value="7">7 px</option><option value="8">8 px</option><option value="9">9 px</option><option value="10">10 px</option><option value="11">11 px</option><option value="12">12 px</option><option value="13">13 px</option><option value="14">14 px</option><option value="15">15 px</option><option value="16">16 px</option><option value="17">17 px</option><option value="18">18 px</option><option value="19">19 px</option><option value="20">20 px</option><option value="21">21 px</option><option value="22">22 px</option><option value="23">23 px</option><option value="24">24 px</option></select></div></div><div class="card"><h3>動画</h3><div class="settingsline"><label>コメント表示間隔</label><input id="interval" type="range" min="0.4" max="5" step="0.1" value="1.2"><span id="intervalLabel">1.2秒</span></div><div class="settingsline"><label>再生速度</label><select id="speed"><option value="0.5">0.5倍</option><option value="1" selected>1倍</option><option value="1.5">1.5倍</option><option value="2">2倍</option></select></div></div><div class="card"><h3>データ管理</h3><button class="btn gray" id="reloadApp" type="button">⟳ アプリを再読み込み</button><p class="hint">端末内に自動保存します。ブラウザのデータ消去に備えてバックアップしてください。</p><div class="chiplist"><button class="btn gray" id="exportJson">バックアップ保存</button><button class="btn gray" id="importJson">バックアップ復元</button><button class="btn gray" id="undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-2"/></svg> 元に戻す</button><button class="btn gray" id="redo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h2"/></svg> やり直す</button></div><input type="file" id="importFile" accept=".json,application/json" class="hidden"></div></div><nav class="tabs"><button data-page="home"><span><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.2A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8 11.5h.01M12 11.5h.01M16 11.5h.01"/></svg></span>会話</button><button data-page="characters"><span><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 21v-2.2a7 7 0 0 1 14 0V21"/></svg></span>キャラ</button><button data-page="settings" class="active"><span><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/><circle cx="8" cy="7" r="2" fill="currentColor" stroke="none"/><circle cx="16" cy="17" r="2" fill="currentColor" stroke="none"/></svg></span>設定</button></nav></section>
<section class="view" id="video"><div class="scroll"><div class="phone"><canvas id="videoCanvas" width="1080" height="1920"></canvas></div><div class="videoctl"><div class="small">動画サイズ：1080 × 1920（9:16）・表示間隔 <span id="videoIntervalDisplay">3.0秒</span></div><div class="small" id="videoProjectName"></div><div class="video-speed-row"><span>再生速度</span><select id="videoSpeed" aria-label="動画再生速度"><option value="0.5">0.5×</option><option value="1">1.0×</option><option value="1.5">1.5×</option><option value="2">2.0×</option></select></div><div class="preview-skips preview-transport"><button id="videoRewind10" type="button" aria-label="10秒戻る"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 14a17 17 0 1 1-5 15"/><path d="M7 8v11h11"/><text x="24" y="30">10</text></svg><span>10秒戻る</span></button><button class="video-play-btn" id="preview" type="button" aria-label="再生・一時停止"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>再生</span></button><button id="videoForward10" type="button" aria-label="10秒進む"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M36 14a17 17 0 1 0 5 15"/><path d="M41 8v11H30"/><text x="24" y="30">10</text></svg><span>10秒進む</span></button></div><div class="preview-restart"><button class="btn gray video-play-btn" id="restartPreview" aria-label="先頭に戻る"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7V3m0 4H2m4 0a9 9 0 1 1-2 10"/></svg><span>最初から</span></button></div><div class="seek-controls"><input type="range" id="videoSeek" min="0" max="1000" value="0" step="1" aria-label="プレビューの再生位置"><div class="small" id="videoClock">0:00 / 0:00</div></div><button class="btn" id="record">● 動画を書き出す</button><progress id="progress" max="100" value="0" class="hidden"></progress><div id="videoProgressText" class="hidden" aria-live="polite"></div><div class="small" id="videoStatus">吹き出しが順番に「ポンッ」と表示されます。入力中アニメーションはありません。</div><a id="download" class="download hidden">動画をダウンロード</a></div></div></section></div>
<div id="videoFloating" class="video-floating hidden" aria-live="polite"><button id="videoFloatingMini" type="button" aria-label="動画の進捗を表示"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" class="track"/><circle id="videoRing" cx="24" cy="24" r="19" class="meter"/><text id="videoRingText" x="24" y="29" text-anchor="middle">0%</text></svg></button><div id="videoFloatingDetails" class="video-floating-details hidden"><div class="video-float-head"><strong id="videoFloatState">動画を作成中…</strong><button id="videoFloatCollapse" type="button" aria-label="折りたたむ">⌃</button></div><div id="videoFloatTitle" class="video-float-title"></div><progress id="videoFloatProgress" value="0" max="100"></progress><button type="button" id="videoFloatReturn" class="hidden">動画を確認・保存</button></div></div><div class="action-toast" id="actionToast" role="status" aria-live="polite"></div><div class="sheet-shade" id="shade"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
